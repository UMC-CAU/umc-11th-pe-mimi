name: movielog
description: MovieLog - UMC Flutter 스터디 1주차 미션 (프로필 화면)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  # Manrope 폰트 파일(Manrope-VariableFont_wght.ttf)을 MovieLog 공통 Asset & Font ZIP에서
  # 내려받아 assets/fonts/ 에 넣은 뒤 아래 주석을 해제하세요.
  # fonts:
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-VariableFont_wght.ttf
